# Local stack: Postgres + BAGFLIP. `docker compose up --build`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bagflip
      POSTGRES_PASSWORD: bagflip
      POSTGRES_DB: bagflip
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - bagflip-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagflip"]
      interval: 5s
      retries: 10

  bagflip:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://bagflip:bagflip@postgres:5432/bagflip
      ROLE: all
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bagflip-pg:
